services:
  db:
    # Official pgvector image: stock Postgres 16 with the vector extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: text2sql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # localhost only: the database is never reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Full stack: `make stack-up` (profile "app"). `make db-up` still starts only the database.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DB_HOST_OVERRIDE: db  # the same .env URLs, pointed at the db container
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  pgdata:
