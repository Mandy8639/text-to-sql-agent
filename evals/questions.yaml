  # ==========================================================================================
  # Hardened set (added after the first baseline run saturated the original 80 answerable
  # questions; see decision D24). These need multi-step logic, avoid join fan-out, handle NULLs,
  # or compare periods/cohorts: the places where SQL that looks right is often wrong.
  # ==========================================================================================

  - id: agg-17
    split: test
    category: aggregation
    difficulty: hard
    expected: answer
    question: What percentage of unique customers have placed more than one order?
    gold_sql: |
      WITH per_person AS (
        SELECT c.customer_unique_id, count(*) AS orders
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        GROUP BY c.customer_unique_id
      )
      SELECT round(100.0 * count(*) FILTER (WHERE orders > 1) / count(*), 2) AS pct_repeat
      FROM per_person
    notes: Trap - customer_id is per order, so counting by it gives 0% repeat customers.

  - id: agg-18
    split: dev
    category: aggregation
    difficulty: hard
    expected: answer
    question: What was the total payment value of orders that contain at least one furniture_decor item?
    gold_sql: |
      SELECT sum(p.payment_value) AS total_payments
      FROM order_payments p
      WHERE p.order_id IN (
        SELECT oi.order_id
        FROM order_items oi
        JOIN products pr ON pr.product_id = oi.product_id
        WHERE pr.product_category_name_english = 'furniture_decor'
      )
    notes: Trap - joining payments to items counts an order's payment once per item.

  - id: agg-19
    split: test
    category: aggregation
    difficulty: hard
    expected: answer
    question: How many orders have a total payment that differs from the sum of their items' price plus freight by more than 1 BRL?
    gold_sql: |
      WITH items AS (
        SELECT order_id, sum(price + freight_value) AS item_total FROM order_items GROUP BY order_id
      ), pays AS (
        SELECT order_id, sum(payment_value) AS paid FROM order_payments GROUP BY order_id
      )
      SELECT count(*) AS orders
      FROM items i
      JOIN pays p ON p.order_id = i.order_id
      WHERE abs(p.paid - i.item_total) > 1
    notes: Both sides must be aggregated per order before comparing. Orders missing either side are excluded.

  - id: agg-20
    split: test
    category: aggregation
    difficulty: hard
    expected: answer
    question: Which 3 customer states have the longest median delivery time?
