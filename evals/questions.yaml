      WITH monthly AS (
        SELECT coalesce(p.product_category_name_english, 'unknown') AS category,
               sum(oi.price) FILTER (WHERE o.order_purchase_timestamp >= '2018-07-01' AND o.order_purchase_timestamp < '2018-08-01') AS jul,
               sum(oi.price) FILTER (WHERE o.order_purchase_timestamp >= '2018-08-01' AND o.order_purchase_timestamp < '2018-09-01') AS aug
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
