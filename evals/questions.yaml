  - id: join-20
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: What were the total revenue and the total freight for each customer state?
    gold_sql: |
      WITH valid AS (
        SELECT o.order_id, c.customer_state
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
      ), rev AS (
        SELECT v.customer_state, sum(p.payment_value) AS revenue
        FROM valid v JOIN order_payments p ON p.order_id = v.order_id
        GROUP BY 1
      ), freight AS (
        SELECT v.customer_state, sum(oi.freight_value) AS freight
        FROM valid v JOIN order_items oi ON oi.order_id = v.order_id
        GROUP BY 1
      )
      SELECT r.customer_state, r.revenue, f.freight
      FROM rev r JOIN freight f ON f.customer_state = r.customer_state
    notes: Trap - joining payments and items in one query multiplies both sums.

