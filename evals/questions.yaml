# Text-to-SQL benchmark for the Olist dataset.
#
# Fields
#   id          stable identifier (never reused)
#   split       dev | test. Dev may be used for few-shot examples and tuning. Test must NEVER be
#               used in prompts or examples (enforced in evals/dataset.py and the eval harness).
#   category    aggregation | filtering | joins | time_series | window_functions | ambiguous | refusal
#   difficulty  easy | medium | hard
#   expected    answer | clarify | refuse. What a good agent should do.
#   gold_sql    reference query (answer questions only). Scored by comparing result sets.
#   order_matters  true only when the question asks for an explicit ranking order.
#   verify      true = the author is not fully sure the gold SQL is the right reading; review.
#   notes       why the gold SQL is written this way.
#
# Gold SQL conventions (from docs/schema.yaml ambiguities A1-A6)
#   - Order-level revenue (totals, by customer, by state, by month) = SUM(order_payments.payment_value).
#     Revenue by product, category or seller = SUM(order_items.price), freight excluded.
#   - Revenue / sales / "sold" questions exclude orders with status canceled or unavailable.
#     Count-of-orders questions without those words include every status.
#   - Time questions use orders.order_purchase_timestamp unless they name another date.
#   - "Customers" as people = customers.customer_unique_id.
#   - Delivery time = order_delivered_customer_date - order_purchase_timestamp in decimal days,
#     delivered orders with a delivery date only.
#   - Gold queries return only the columns the question asks for. For "which ..." questions that
#     is the identifying column; extra columns in the agent's answer are not penalised.

questions:

  # ------------------------------------------------------------------------------------------
  # aggregation
  # ------------------------------------------------------------------------------------------
  - id: agg-01
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: How many orders are in the dataset?
    gold_sql: SELECT count(*) AS orders FROM orders

  - id: agg-02
    split: dev
    category: aggregation
    difficulty: easy
    expected: answer
    question: How many unique customers are there?
    gold_sql: SELECT count(DISTINCT customer_unique_id) AS customers FROM customers

  - id: agg-03
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: How many sellers are on the platform?
    gold_sql: SELECT count(*) AS sellers FROM sellers

  - id: agg-04
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: What is the average review score across all reviews?
    gold_sql: SELECT round(avg(review_score), 2) AS avg_score FROM order_reviews

  - id: agg-05
    split: dev
    category: aggregation
    difficulty: easy
    expected: answer
    question: How many orders are there in each order status?
    gold_sql: |
      SELECT order_status, count(*) AS orders
      FROM orders
      GROUP BY order_status

  - id: agg-06
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: What is the total value of all payments in the dataset?
    gold_sql: SELECT sum(payment_value) AS total_payments FROM order_payments

  - id: agg-07
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: What is the average price of an order item?
    gold_sql: SELECT round(avg(price), 2) AS avg_price FROM order_items

  - id: agg-08
    split: dev
    category: aggregation
    difficulty: medium
    expected: answer
    question: On average, how many items does an order contain? Only count orders that have at least one item.
    gold_sql: |
      SELECT round(count(*)::numeric / count(DISTINCT order_id), 2) AS avg_items_per_order
      FROM order_items

  - id: agg-09
    split: test
    category: aggregation
    difficulty: medium
    expected: answer
    question: How many products are there in each product category (English names)?
    gold_sql: |
      SELECT coalesce(product_category_name_english, 'unknown') AS category, count(*) AS products
      FROM products
      GROUP BY 1

  - id: agg-10
    split: test
    category: aggregation
    difficulty: easy
    expected: answer
    question: How many distinct orders used each payment type?
    gold_sql: |
      SELECT payment_type, count(DISTINCT order_id) AS orders
      FROM order_payments
      GROUP BY payment_type

  - id: agg-11
    split: dev
    category: aggregation
    difficulty: medium
    expected: answer
    question: What is the average payment amount for each payment type?
    gold_sql: |
      SELECT payment_type, round(avg(payment_value), 2) AS avg_payment
      FROM order_payments
      GROUP BY payment_type
    notes: Averages individual payment rows, not per-order totals.

  - id: agg-12
    split: test
    category: aggregation
    difficulty: medium
    expected: answer
    question: What percentage of all orders have the status delivered?
    gold_sql: |
      SELECT round(100.0 * count(*) FILTER (WHERE order_status = 'delivered') / count(*), 2) AS pct_delivered
      FROM orders

  - id: agg-13
    split: test
    category: aggregation
    difficulty: medium
    expected: answer
    question: What is the average number of installments for credit card payments?
    gold_sql: |
      SELECT round(avg(payment_installments), 2) AS avg_installments
      FROM order_payments
      WHERE payment_type = 'credit_card'

  - id: agg-14
    split: dev
    category: aggregation
    difficulty: medium
    expected: answer
    question: What percentage of reviews give a score of 5?
    gold_sql: |
      SELECT round(100.0 * count(*) FILTER (WHERE review_score = 5) / count(*), 2) AS pct_five_star
      FROM order_reviews

  - id: agg-15
    split: test
    category: aggregation
    difficulty: hard
    expected: answer
    question: What is the average order value, measured as total payment per order, for orders that were not canceled or unavailable?
    gold_sql: |
      WITH per_order AS (
        SELECT p.order_id, sum(p.payment_value) AS order_value
        FROM order_payments p
        JOIN orders o ON o.order_id = p.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY p.order_id
      )
      SELECT round(avg(order_value), 2) AS avg_order_value FROM per_order
    notes: Payments must be summed per order first; averaging payment rows would be wrong.

  - id: agg-16
    split: test
    category: aggregation
    difficulty: hard
    expected: answer
    question: What is the median total payment per order, across all orders?
    gold_sql: |
      WITH per_order AS (
        SELECT order_id, sum(payment_value) AS order_value
        FROM order_payments
        GROUP BY order_id
      )
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY order_value)::numeric, 2) AS median_order_value
      FROM per_order

  # ------------------------------------------------------------------------------------------
  # filtering
  # ------------------------------------------------------------------------------------------
  - id: flt-01
    split: dev
    category: filtering
    difficulty: easy
    expected: answer
    question: How many orders were canceled?
    gold_sql: SELECT count(*) AS canceled_orders FROM orders WHERE order_status = 'canceled'

  - id: flt-02
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many unique customers live in the state of Rio de Janeiro (RJ)?
    gold_sql: SELECT count(DISTINCT customer_unique_id) AS customers FROM customers WHERE customer_state = 'RJ'

  - id: flt-03
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many products weigh more than 10 kg?
    gold_sql: SELECT count(*) AS products FROM products WHERE product_weight_g > 10000

  - id: flt-04
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many order items cost more than 1,000 BRL?
    gold_sql: SELECT count(*) AS items FROM order_items WHERE price > 1000

  - id: flt-05
    split: dev
    category: filtering
    difficulty: medium
    expected: answer
    question: How many orders were placed in November 2017?
    gold_sql: |
      SELECT count(*) AS orders
      FROM orders
      WHERE order_purchase_timestamp >= '2017-11-01' AND order_purchase_timestamp < '2017-12-01'

  - id: flt-06
    split: test
    category: filtering
    difficulty: medium
    expected: answer
    question: How many delivered orders arrived after their estimated delivery date?
    gold_sql: |
      SELECT count(*) AS late_orders
      FROM orders
      WHERE order_status = 'delivered'
        AND order_delivered_customer_date > order_estimated_delivery_date

  - id: flt-07
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many sellers are based in the state of São Paulo?
    gold_sql: SELECT count(*) AS sellers FROM sellers WHERE seller_state = 'SP'

  - id: flt-08
    split: test
    category: filtering
    difficulty: medium
    expected: answer
    question: How many 1-star reviews include a comment message?
    gold_sql: |
      SELECT count(*) AS reviews
      FROM order_reviews
      WHERE review_score = 1 AND review_comment_message IS NOT NULL
    verify: true
    notes: >
      Counts (review, order) rows: 8,745. Counting distinct review_id gives 8,641, because one
      review can cover several orders. Opus 5.5 chose distinct reviews, Haiku 5.5 chose rows.

  - id: flt-09
    split: dev
    category: filtering
    difficulty: medium
    expected: answer
    question: Which payment types were used for payments with more than 10 installments?
    gold_sql: |
      SELECT DISTINCT payment_type
      FROM order_payments
      WHERE payment_installments > 10

  - id: flt-10
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many distinct orders were paid at least partly with a voucher?
    gold_sql: SELECT count(DISTINCT order_id) AS orders FROM order_payments WHERE payment_type = 'voucher'

  - id: flt-11
    split: test
    category: filtering
    difficulty: easy
    expected: answer
    question: How many products have no category?
    gold_sql: SELECT count(*) AS products FROM products WHERE product_category_name IS NULL

  - id: flt-12
    split: test
    category: filtering
    difficulty: hard
    expected: answer
    question: How many orders contain items from more than one seller?
    gold_sql: |
      SELECT count(*) AS orders
      FROM (
        SELECT order_id FROM order_items GROUP BY order_id HAVING count(DISTINCT seller_id) > 1
      ) multi

  - id: flt-13
    split: dev
    category: filtering
    difficulty: medium
    expected: answer
    question: How many customers (unique people) have placed more than one order?
    gold_sql: |
      SELECT count(*) AS repeat_customers
      FROM (
        SELECT c.customer_unique_id
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        GROUP BY c.customer_unique_id
        HAVING count(*) > 1
      ) repeaters

  - id: flt-14
    split: test
    category: filtering
    difficulty: medium
    expected: answer
    question: List the cities in the state of Acre (AC) with the number of unique customers in each.
    gold_sql: |
      SELECT customer_city, count(DISTINCT customer_unique_id) AS customers
      FROM customers
      WHERE customer_state = 'AC'
      GROUP BY customer_city

  - id: flt-15
    split: test
    category: filtering
    difficulty: medium
    expected: answer
    question: How many orders were approved more than 24 hours after they were placed?
    gold_sql: |
      SELECT count(*) AS orders
      FROM orders
      WHERE order_approved_at > order_purchase_timestamp + interval '24 hours'

  # ------------------------------------------------------------------------------------------
  # joins
  # ------------------------------------------------------------------------------------------
  - id: join-01
    split: dev
    category: joins
    difficulty: medium
    expected: answer
    question: What are the top 5 product categories by number of units sold?
    gold_sql: |
      SELECT coalesce(p.product_category_name_english, 'unknown') AS category
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1
      ORDER BY count(*) DESC
      LIMIT 5

  - id: join-02
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: Which 5 sellers generated the most revenue?
    gold_sql: |
      SELECT oi.seller_id
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY oi.seller_id
      ORDER BY sum(oi.price) DESC
      LIMIT 5

  - id: join-03
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: What is the total revenue by customer state?
    gold_sql: |
      SELECT c.customer_state, sum(p.payment_value) AS revenue
      FROM order_payments p
      JOIN orders o ON o.order_id = p.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY c.customer_state
    notes: State is an order-level attribute, so revenue uses payments (A1).

  - id: join-04
    split: dev
    category: joins
    difficulty: hard
    expected: answer
    question: What is the average review score for each product category?
    gold_sql: |
      WITH order_categories AS (
        SELECT DISTINCT oi.order_id, coalesce(p.product_category_name_english, 'unknown') AS category
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
      )
      SELECT oc.category, round(avg(r.review_score), 2) AS avg_score
      FROM order_categories oc
      JOIN order_reviews r ON r.order_id = oc.order_id
      GROUP BY oc.category
    verify: true
    notes: >
      Reviews are per order, not per item. Counting each (order, category) once avoids weighting
      an order with 3 units of the same category 3 times.

  - id: join-05
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: Which customer state has the highest average freight value per order item?
    gold_sql: |
      SELECT c.customer_state
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      GROUP BY c.customer_state
      ORDER BY avg(oi.freight_value) DESC
      LIMIT 1

  - id: join-06
    split: test
    category: joins
    difficulty: easy
    expected: answer
    question: How many orders came from each customer state?
    gold_sql: |
      SELECT c.customer_state, count(*) AS orders
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      GROUP BY c.customer_state

  - id: join-07
    split: dev
    category: joins
    difficulty: medium
    expected: answer
    question: What is the average delivery time in days (as a decimal, from purchase to delivery) for each customer state?
    gold_sql: |
      SELECT c.customer_state,
             round(avg(extract(epoch FROM o.order_delivered_customer_date - o.order_purchase_timestamp) / 86400)::numeric, 2) AS avg_delivery_days
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
      GROUP BY c.customer_state

  - id: join-08
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: Which 10 cities have the most unique customers?
    gold_sql: |
      SELECT customer_city
      FROM customers
      GROUP BY customer_city
      ORDER BY count(DISTINCT customer_unique_id) DESC
      LIMIT 10

  - id: join-09
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: What is the average review score of orders paid with each payment type?
    gold_sql: |
      WITH order_types AS (
        SELECT DISTINCT order_id, payment_type FROM order_payments
      )
      SELECT t.payment_type, round(avg(r.review_score), 2) AS avg_score
      FROM order_types t
      JOIN order_reviews r ON r.order_id = t.order_id
      GROUP BY t.payment_type
    notes: An order paid in 3 credit-card rows should count once for credit_card.

  - id: join-10
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: What was the total freight charged on items in the furniture_decor category?
    gold_sql: |
      SELECT sum(oi.freight_value) AS total_freight
      FROM order_items oi
      JOIN products p ON p.product_id = oi.product_id
      WHERE p.product_category_name_english = 'furniture_decor'
    verify: true
    notes: Not a revenue/sales question, so no status filter.

  - id: join-11
    split: dev
    category: joins
    difficulty: medium
    expected: answer
    question: How many different sellers have sold at least one product in the health_beauty category?
    gold_sql: |
      SELECT count(DISTINCT oi.seller_id) AS sellers
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE p.product_category_name_english = 'health_beauty'
        AND o.order_status NOT IN ('canceled', 'unavailable')

  - id: join-12
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: What was the total revenue from customers in Minas Gerais (MG)?
    gold_sql: |
      SELECT sum(p.payment_value) AS revenue
      FROM order_payments p
      JOIN orders o ON o.order_id = p.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE c.customer_state = 'MG'
        AND o.order_status NOT IN ('canceled', 'unavailable')

  - id: join-13
    split: test
    category: joins
    difficulty: easy
    expected: answer
    question: What is the English name of the product category 'cama_mesa_banho'?
    gold_sql: |
      SELECT product_category_name_english
      FROM category_translation
      WHERE product_category_name = 'cama_mesa_banho'

  - id: join-14
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: Which product category has the highest average review score among categories with at least 100 reviewed orders?
    gold_sql: |
      WITH order_categories AS (
        SELECT DISTINCT oi.order_id, coalesce(p.product_category_name_english, 'unknown') AS category
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
      )
      SELECT oc.category
      FROM order_categories oc
      JOIN order_reviews r ON r.order_id = oc.order_id
      GROUP BY oc.category
      HAVING count(DISTINCT oc.order_id) >= 100
      ORDER BY avg(r.review_score) DESC
      LIMIT 1
    verify: true
    notes: Same per-(order, category) logic as join-04.

  - id: join-15
    split: dev
    category: joins
    difficulty: medium
    expected: answer
    question: How many orders include at least one product from the computers_accessories category?
    gold_sql: |
      SELECT count(DISTINCT oi.order_id) AS orders
      FROM order_items oi
      JOIN products p ON p.product_id = oi.product_id
      WHERE p.product_category_name_english = 'computers_accessories'

  - id: join-16
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: Which 3 sellers have the highest average review score among sellers with at least 50 reviewed orders?
    gold_sql: |
      WITH order_sellers AS (
        SELECT DISTINCT order_id, seller_id FROM order_items
      )
      SELECT os.seller_id
      FROM order_sellers os
      JOIN order_reviews r ON r.order_id = os.order_id
      GROUP BY os.seller_id
      HAVING count(DISTINCT os.order_id) >= 50
      ORDER BY avg(r.review_score) DESC
      LIMIT 3

  - id: join-17
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: How many unique customers bought from a seller located in a different state from their own?
    gold_sql: |
      SELECT count(DISTINCT c.customer_unique_id) AS customers
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      JOIN sellers s ON s.seller_id = oi.seller_id
      WHERE s.seller_state <> c.customer_state
        AND o.order_status NOT IN ('canceled', 'unavailable')
    verify: true
    notes: '"Bought" treated as a sale, so canceled/unavailable orders are excluded.'

  - id: join-18
    split: test
    category: joins
    difficulty: medium
    expected: answer
    question: What is the average price of items sold by sellers in each seller state?
    gold_sql: |
      SELECT s.seller_state, round(avg(oi.price), 2) AS avg_price
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      JOIN sellers s ON s.seller_id = oi.seller_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY s.seller_state

  # ------------------------------------------------------------------------------------------
  # time_series
  # ------------------------------------------------------------------------------------------
  - id: ts-01
    split: test
    category: time_series
    difficulty: easy
    expected: answer
    question: How many orders were placed in each year?
    gold_sql: |
      SELECT extract(year FROM order_purchase_timestamp)::int AS year, count(*) AS orders
      FROM orders
      GROUP BY 1

  - id: ts-02
    split: dev
    category: time_series
    difficulty: easy
    expected: answer
    question: How many orders were placed in each month of 2017?
    gold_sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::date AS month, count(*) AS orders
      FROM orders
      WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
      GROUP BY 1

  - id: ts-03
    split: dev
    category: time_series
    difficulty: medium
    expected: answer
    question: What was the total revenue in each month from January to August 2018?
    gold_sql: |
      SELECT date_trunc('month', o.order_purchase_timestamp)::date AS month, sum(p.payment_value) AS revenue
      FROM order_payments p
      JOIN orders o ON o.order_id = p.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'
      GROUP BY 1

  - id: ts-04
    split: test
    category: time_series
    difficulty: medium
    expected: answer
    question: Which month had the most orders?
    gold_sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::date AS month
      FROM orders
      GROUP BY 1
      ORDER BY count(*) DESC
      LIMIT 1

  - id: ts-05
    split: test
    category: time_series
    difficulty: medium
    expected: answer
    question: What was the average review score for each month of 2018, based on when the review was created?
    gold_sql: |
      SELECT date_trunc('month', review_creation_date)::date AS month, round(avg(review_score), 2) AS avg_score
      FROM order_reviews
      WHERE review_creation_date >= '2018-01-01' AND review_creation_date < '2019-01-01'
      GROUP BY 1

  - id: ts-06
    split: dev
    category: time_series
    difficulty: hard
    expected: answer
    question: How many new customers (people placing their first ever order) were there in each month of 2017?
    gold_sql: |
      WITH first_orders AS (
        SELECT c.customer_unique_id, min(o.order_purchase_timestamp) AS first_purchase
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        GROUP BY c.customer_unique_id
      )
      SELECT date_trunc('month', first_purchase)::date AS month, count(*) AS new_customers
      FROM first_orders
      WHERE first_purchase >= '2017-01-01' AND first_purchase < '2018-01-01'
      GROUP BY 1

  - id: ts-07
    split: test
    category: time_series
    difficulty: easy
    expected: answer
    question: What was the total revenue in Q4 2017?
    gold_sql: |
      SELECT sum(p.payment_value) AS revenue
      FROM order_payments p
      JOIN orders o ON o.order_id = p.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2017-10-01' AND o.order_purchase_timestamp < '2018-01-01'

  - id: ts-08
    split: test
    category: time_series
    difficulty: medium
    expected: answer
    question: On which day of the week (e.g. Monday) are the most orders placed?
    gold_sql: |
      SELECT trim(to_char(order_purchase_timestamp, 'Day')) AS weekday
      FROM orders
      GROUP BY 1
      ORDER BY count(*) DESC
      LIMIT 1

  - id: ts-09
    split: dev
    category: time_series
    difficulty: medium
    expected: answer
    question: At which hour of the day (0-23) are the most orders placed?
    gold_sql: |
      SELECT extract(hour FROM order_purchase_timestamp)::int AS hour
      FROM orders
      GROUP BY 1
      ORDER BY count(*) DESC
      LIMIT 1

  - id: ts-10
    split: test
    category: time_series
    difficulty: hard
    expected: answer
    question: For each purchase month of 2017, what was the average delivery time in days (as a decimal) for delivered orders?
    gold_sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::date AS month,
             round(avg(extract(epoch FROM order_delivered_customer_date - order_purchase_timestamp) / 86400)::numeric, 2) AS avg_delivery_days
      FROM orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
        AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
      GROUP BY 1

  - id: ts-11
    split: test
    category: time_series
    difficulty: medium
    expected: answer
    question: How many orders were placed on Black Friday 2017 (November 24, 2017)?
    gold_sql: |
      SELECT count(*) AS orders
      FROM orders
