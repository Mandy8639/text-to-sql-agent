  - id: join-22
    split: dev
    category: joins
    difficulty: medium
    expected: answer
    question: For each seller state, what is the average number of days (as a decimal) between payment approval and hand-off to the carrier?
    gold_sql: |
      WITH order_states AS (
        SELECT DISTINCT oi.order_id, s.seller_state
        FROM order_items oi
        JOIN sellers s ON s.seller_id = oi.seller_id
      )
      SELECT os.seller_state,
             round(avg(extract(epoch FROM o.order_delivered_carrier_date - o.order_approved_at) / 86400)::numeric, 2) AS avg_days_to_carrier
      FROM order_states os
      JOIN orders o ON o.order_id = os.order_id
      WHERE o.order_approved_at IS NOT NULL AND o.order_delivered_carrier_date IS NOT NULL
      GROUP BY os.seller_state
    notes: Each order counts once per seller state, not once per item.

  - id: join-23
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: Which 5 routes from seller state to customer state have the most orders?
    gold_sql: |
      SELECT s.seller_state, c.customer_state
      FROM order_items oi
      JOIN sellers s ON s.seller_id = oi.seller_id
      JOIN orders o ON o.order_id = oi.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      GROUP BY s.seller_state, c.customer_state
      ORDER BY count(DISTINCT oi.order_id) DESC
      LIMIT 5
    notes: Orders, not items - count(DISTINCT order_id) per route.

  - id: join-24
    split: test
    category: joins
    difficulty: hard
    expected: answer
    question: For each customer state with at least 1,000 orders, what is the average order value (total payment per order)?
    gold_sql: |
      WITH per_order AS (
        SELECT o.order_id, c.customer_state, sum(p.payment_value) AS order_value
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        JOIN order_payments p ON p.order_id = o.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY o.order_id, c.customer_state
      )
      SELECT customer_state, round(avg(order_value), 2) AS avg_order_value
      FROM per_order
      GROUP BY customer_state
      HAVING count(*) >= 1000
    verify: true
    notes: The 1,000-order threshold counts the same (non-canceled, paid) orders that are averaged.

  - id: ts-16
    split: test
    category: time_series
    difficulty: hard
    expected: answer
    question: By what percentage did revenue in January–August 2018 grow compared with January–August 2017?
    gold_sql: |
      WITH rev AS (
        SELECT sum(p.payment_value) FILTER (WHERE o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2017-09-01') AS r2017,
               sum(p.payment_value) FILTER (WHERE o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01') AS r2018
        FROM order_payments p
        JOIN orders o ON o.order_id = p.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
      )
      SELECT round(100 * (r2018 - r2017) / r2017, 2) AS pct_growth FROM rev

  - id: ts-17
    split: test
    category: time_series
    difficulty: medium
    expected: answer
    question: What was the cancellation rate (percentage of orders canceled) for each month of 2017?
    gold_sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::date AS month,
             round(100.0 * count(*) FILTER (WHERE order_status = 'canceled') / count(*), 2) AS pct_canceled
      FROM orders
      WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
      GROUP BY 1

  - id: ts-18
    split: dev
    category: time_series
    difficulty: hard
    expected: answer
    question: Of the customers whose first order was in January 2018, how many placed another order within 90 days of that first order?
    gold_sql: |
      WITH person_orders AS (
        SELECT c.customer_unique_id, o.order_purchase_timestamp AS ts
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
      ), firsts AS (
        SELECT customer_unique_id, min(ts) AS first_ts
        FROM person_orders
        GROUP BY customer_unique_id
        HAVING min(ts) >= '2018-01-01' AND min(ts) < '2018-02-01'
      )
      SELECT count(DISTINCT f.customer_unique_id) AS returning_customers
      FROM firsts f
      JOIN person_orders po ON po.customer_unique_id = f.customer_unique_id
      WHERE po.ts > f.first_ts AND po.ts <= f.first_ts + interval '90 days'

  - id: ts-19
    split: test
    category: time_series
    difficulty: hard
    expected: answer
    question: For the top 5 product categories by 2017 revenue, what was each category's revenue in January–August 2018?
    gold_sql: |
      WITH cat_rev AS (
        SELECT coalesce(p.product_category_name_english, 'unknown') AS category,
               sum(oi.price) FILTER (WHERE o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01') AS rev_2017,
               sum(oi.price) FILTER (WHERE o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01') AS rev_2018
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY 1
      )
      SELECT category, rev_2018
      FROM cat_rev
      ORDER BY rev_2017 DESC NULLS LAST
      LIMIT 5
    notes: NULL trap - categories with no 2017 sales have rev_2017 NULL, which sorts FIRST under DESC.

  - id: win-13
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: What percentage of item revenue in January–August 2018 came from the 10 products with the highest revenue in that period?
    gold_sql: |
      WITH prod AS (
        SELECT oi.product_id, sum(oi.price) AS revenue
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'
        GROUP BY oi.product_id
      ), ranked AS (
        SELECT revenue, row_number() OVER (ORDER BY revenue DESC) AS rn FROM prod
      )
      SELECT round(100 * sum(revenue) FILTER (WHERE rn <= 10) / sum(revenue), 2) AS pct_top10
      FROM ranked

  - id: win-14
    split: dev
    category: window_functions
    difficulty: hard
    expected: answer
    question: For each customer state, what percentage of its orders included at least one boleto payment?
    gold_sql: |
      WITH order_flags AS (
        SELECT o.order_id, c.customer_state,
               EXISTS (SELECT 1 FROM order_payments p WHERE p.order_id = o.order_id AND p.payment_type = 'boleto') AS has_boleto
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
      )
      SELECT customer_state, round(100.0 * count(*) FILTER (WHERE has_boleto) / count(*), 2) AS pct_boleto
      FROM order_flags
      GROUP BY customer_state
    notes: Denominator is all of the state's orders; an order with two boleto rows counts once.

  - id: win-15
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: Which product category has the highest percentage of late deliveries, among categories with at least 500 delivered orders?
    gold_sql: |
      WITH order_cats AS (
        SELECT DISTINCT oi.order_id, coalesce(p.product_category_name_english, 'unknown') AS category
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
      )
      SELECT oc.category
      FROM order_cats oc
      JOIN orders o ON o.order_id = oc.order_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
      GROUP BY oc.category
      HAVING count(*) >= 500
      ORDER BY avg((o.order_delivered_customer_date > o.order_estimated_delivery_date)::int) DESC
      LIMIT 1
    verify: true
    notes: Late = delivered after the estimate. Each (order, category) pair counts once.

  - id: win-16
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: How much lower is the average review score for delivered orders that arrived late than for delivered orders that arrived on time?
    gold_sql: |
      SELECT round(
               avg(r.review_score) FILTER (WHERE o.order_delivered_customer_date <= o.order_estimated_delivery_date)
             - avg(r.review_score) FILTER (WHERE o.order_delivered_customer_date > o.order_estimated_delivery_date), 2
             ) AS score_gap
      FROM orders o
      JOIN order_reviews r ON r.order_id = o.order_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    notes: A positive number (on-time average minus late average).

  - id: win-17
    split: dev
    category: window_functions
    difficulty: medium
    expected: answer
    question: What percentage of 2017 revenue came from orders paid entirely by credit card?
    gold_sql: |
      WITH per_order AS (
        SELECT p.order_id, sum(p.payment_value) AS paid, bool_and(p.payment_type = 'credit_card') AS card_only
        FROM order_payments p
        JOIN orders o ON o.order_id = p.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
        GROUP BY p.order_id
      )
      SELECT round(100 * sum(paid) FILTER (WHERE card_only) / sum(paid), 2) AS pct_card_only
      FROM per_order

  - id: win-18
    split: test
    category: window_functions
    difficulty: medium
    expected: answer
    question: For each month from January to August 2018, what was the cumulative revenue since the start of 2018?
    gold_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', o.order_purchase_timestamp)::date AS month, sum(p.payment_value) AS revenue
        FROM order_payments p
        JOIN orders o ON o.order_id = p.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'
        GROUP BY 1
      )
      SELECT month, sum(revenue) OVER (ORDER BY month) AS cumulative_revenue
      FROM monthly

