  - id: win-01
    split: dev
    category: window_functions
    difficulty: medium
    expected: answer
    question: Rank the product categories by revenue in 2017 and show the top 3 with their rank.
    order_matters: true
    gold_sql: |
      WITH cat AS (
        SELECT coalesce(p.product_category_name_english, 'unknown') AS category, sum(oi.price) AS revenue
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
        GROUP BY 1
      )
      SELECT category, rank
      FROM (SELECT category, rank() OVER (ORDER BY revenue DESC) AS rank FROM cat) r
      WHERE rank <= 3
      ORDER BY rank

  - id: win-02
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: What was the month-over-month percentage change in the number of orders for each month from January to August 2018?
    gold_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', order_purchase_timestamp)::date AS month, count(*) AS orders
        FROM orders
        GROUP BY 1
      ), changes AS (
        SELECT month,
               round(100.0 * (orders - lag(orders) OVER (ORDER BY month)) / lag(orders) OVER (ORDER BY month), 2) AS pct_change
        FROM monthly
      )
      SELECT month, pct_change
      FROM changes
      WHERE month >= '2018-01-01' AND month < '2018-09-01'
    notes: January 2018 is compared with December 2017.

  - id: win-03
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: For each customer state, which product category generated the most revenue?
    gold_sql: |
      WITH state_cat AS (
        SELECT c.customer_state,
               coalesce(p.product_category_name_english, 'unknown') AS category,
               sum(oi.price) AS revenue
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        JOIN customers c ON c.customer_id = o.customer_id
        JOIN products p ON p.product_id = oi.product_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY 1, 2
      )
      SELECT customer_state, category
      FROM (
        SELECT *, row_number() OVER (PARTITION BY customer_state ORDER BY revenue DESC) AS rn
        FROM state_cat
      ) ranked
      WHERE rn = 1

  - id: win-04
    split: dev
    category: window_functions
    difficulty: medium
    expected: answer
    question: What was the running total of orders by month during 2017?
    gold_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', order_purchase_timestamp)::date AS month, count(*) AS orders
        FROM orders
        WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
        GROUP BY 1
      )
      SELECT month, sum(orders) OVER (ORDER BY month) AS running_total
      FROM monthly
    verify: true
    notes: The running total starts in January 2017 (2016 orders are not carried in).

  - id: win-05
    split: test
    category: window_functions
    difficulty: hard
    expected: answer
    question: What was the 3-month moving average of monthly revenue for each month from January to August 2018?
    gold_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', o.order_purchase_timestamp)::date AS month, sum(p.payment_value) AS revenue
        FROM order_payments p
        JOIN orders o ON o.order_id = p.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY 1
      ), smoothed AS (
        SELECT month, round(avg(revenue) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS moving_avg
        FROM monthly
      )
      SELECT month, moving_avg
      FROM smoothed
      WHERE month >= '2018-01-01' AND month < '2018-09-01'
    verify: true
    notes: Trailing window (current + 2 previous months); Jan and Feb 2018 use Nov/Dec 2017.

  - id: win-06
