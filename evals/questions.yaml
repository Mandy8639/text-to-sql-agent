  - id: win-10
    split: dev
    category: window_functions
    difficulty: hard
    expected: answer
    question: For customers with at least two orders, what is the average number of days (as a decimal) between their first and second order?
    gold_sql: |
      WITH ordered AS (
        SELECT c.customer_unique_id, o.order_purchase_timestamp,
               row_number() OVER (PARTITION BY c.customer_unique_id ORDER BY o.order_purchase_timestamp) AS n
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
      ), pairs AS (
        SELECT customer_unique_id,
               max(order_purchase_timestamp) FILTER (WHERE n = 2) - max(order_purchase_timestamp) FILTER (WHERE n = 1) AS gap
        FROM ordered
        WHERE n <= 2
        GROUP BY customer_unique_id
        HAVING count(*) = 2
      )
      SELECT round(avg(extract(epoch FROM gap) / 86400)::numeric, 2) AS avg_days_between
      FROM pairs

  - id: win-11
    split: test
    category: window_functions
    difficulty: medium
    expected: answer
    question: Which month in 2017 had the largest increase in orders compared with the previous month?
